import groovy.json.JsonOutput

// Shared settings live in gradle/mod.gradle (Minecraft targets) and core/build.gradle (plain Java).
def targets = subprojects.findAll { it.parent?.name == 'versions' }

// One jar for every supported version: Fabric Loader loads only the nested build whose
// Minecraft range matches the running game.
tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Bundles every Minecraft target into one jar.'
    targets.each { dependsOn "${it.path}:build" }
    archiveFileName = "keychain-${mod_version}-universal.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    def metadata = layout.buildDirectory.file('universal/fabric.mod.json')
    doFirst {
        def file = metadata.get().asFile
        file.parentFile.mkdirs()
        file.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            schemaVersion: 1,
            id           : 'keychain_universal',
            version      : mod_version,
            name         : 'Keychain (all versions)',
            description  : 'Loads the Keychain build that matches your Minecraft version.',
            authors      : ['Domsimus'],
            contact      : [homepage: 'https://modrinth.com/mod/keychain'],
            license      : 'MIT',
            icon         : 'assets/keychain/icon.png',
            environment  : 'client',
            jars         : targets.collect { [file: "META-INF/jars/keychain-${mod_version}+mc${it.name}.jar"] },
            depends      : [fabricloader: '>=0.17.3', minecraft: ['~1.21.11', '>=26.1 <26.4'], keychain: '*'],
            custom       : ['modmenu': ['parent': 'keychain']],
        ]))
    }
    from(metadata)
    from(file('LICENSE'))
    from(file('common/src/main/resources/assets/keychain/icon.png')) { into 'assets/keychain' }
    targets.each { target ->
        from(target.file("build/libs/keychain-${mod_version}+mc${target.name}.jar")) { into 'META-INF/jars' }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Tests the core, builds every Minecraft target and the universal jar.'
    dependsOn ':core:test', 'universalJar'
}
